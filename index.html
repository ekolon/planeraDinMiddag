</head>
<body>
<main>
  <h1>Matplanerare</h1>
  <p class="sub">Välj budget och antal portioner, så föreslås recept som går ihop. Priserna kommer från din egen prislista.</p>

  <form id="f">
    <label>Budget (kr)<input id="budget" type="number" min="0" value="800"></label>
    <label>Portioner totalt<input id="total" type="number" min="1" value="16"></label>
    <label>Portioner per recept (storkok)<input id="batch" type="number" min="1" value="8"></label>
    <label>Max tillagningstid (min, 0 = ingen gräns)<input id="maxMin" type="number" min="0" value="60"></label>
    <label>Utesluta ingredienser (kommaseparerat)<input id="exclude" type="text" placeholder="fisk, svamp"></label>
    <label>Typ av protein<select id="protein"><option value="">Alla</option><option value="fisk">Fisk</option><option value="kott">Kött</option><option value="fagel">Fågel</option></select></label>
    <label class="chk"><input id="quick" type="checkbox"> Bara recept under 30 min</label>
    <button type="submit">Föreslå måltider</button>
  </form>

  <div id="out"></div>
</main>

<script>
const UNIT = {kg:['kg',1], hg:['kg',.1], g:['kg',.001], l:['l',1], dl:['l',.1], cl:['l',.01], ml:['l',.001], msk:['l',.015], tsk:['l',.005], krm:['l',.001]};
let recipes = [], prices = {};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr = n => Math.round(n).toLocaleString('sv-SE') + ' kr';

function findPrice(name) {
  let best = null;
  for (const k in prices) if (name.includes(k) && (!best || k.length > best.length)) best = k;
  return best && prices[best];
}

// Returnerar kostnad i kr, 0 om mängd saknas (t.ex. "salt"), eller null om pris saknas.
function ingCost(ing) {
  if (ing.amount == null) return 0;
  const p = findPrice(ing.name);
  if (!p) return null;
  const u = UNIT[ing.unit];
  if (u) return p.per === 'st' ? null : ing.amount * u[1] * p.price; // kg och l räknas som likvärdiga
  if (p.per === 'st') return ing.amount * p.price;
  if (p.stKg) return ing.amount * p.stKg * p.price;
  return null;
}

function recipeCost(r) {
  let sum = 0, unknown = 0;
  for (const ing of r.ingredients) {
    const c = ingCost(ing);
    if (c === null) unknown++; else sum += c;
  }
  return {perPortion: sum / r.servings, unknown};
}

function plan(opts) {
  const ex = opts.exclude.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  const pool = recipes
    .filter(r => !opts.protein || (r.tags || []).includes(opts.protein))
    .filter(r => !opts.quick || (r.tags || []).includes('under-30') || (r.minutes && r.minutes <= 30))
    .filter(r => !opts.maxMin || !r.minutes || r.minutes <= opts.maxMin)
    .filter(r => !r.ingredients.some(i => ex.some(e => i.name.includes(e))))
    .map(r => ({r, ...recipeCost(r)}))
    .filter(x => x.perPortion > 0);

  const chosen = [];
  let left = opts.budget, portionsLeft = opts.total;
  while (portionsLeft > 0 && pool.length) {
    const target = left / portionsLeft;
    const ok = pool.filter(x => !chosen.includes(x) && x.perPortion <= target);
    const rest = pool.filter(x => !chosen.includes(x));
    if (!rest.length) break;
    const pick = ok.length ? ok[Math.floor(Math.random() * ok.length)]
                           : rest.reduce((a, b) => a.perPortion < b.perPortion ? a : b);
    const portions = Math.min(opts.batch, portionsLeft);
    pick.portions = portions;
    pick.cost = pick.perPortion * portions;
    chosen.push(pick);
    left -= pick.cost; portionsLeft -= portions;
  }
  return {chosen, missing: portionsLeft};
}

function shoppingList(chosen) {
  const map = new Map();
  for (const {r, portions} of chosen) {
    const f = portions / r.servings;
    for (const ing of r.ingredients) {
      const key = ing.name + '|' + ing.unit;
      const cur = map.get(key) || {name: ing.name, unit: ing.unit, amount: 0, hasAmount: false};
      if (ing.amount != null) { cur.amount += ing.amount * f; cur.hasAmount = true; }
      map.set(key, cur);
    }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
}

function render(res, budget) {
  const {chosen, missing} = res;
  if (!chosen.length) return `<p class="warn">Inga recept matchade. Prova högre tidsgräns, färre uteslutna ingredienser eller fler priser i prices.json.</p>`;
  const total = chosen.reduce((s, x) => s + x.cost, 0);
  const over = total > budget;
  let html = `<h2>Förslag</h2>`;
  for (const x of chosen) {
    html += `<div class="recipe"><div><a href="${esc(x.r.url)}" target="_blank" rel="noopener">${esc(x.r.name)}</a>
      <div class="meta">${x.portions} portioner${x.r.minutes ? ' · ' + x.r.minutes + ' min' : ''}${x.unknown ? ` · <span class="warn">${x.unknown} ingredienser saknar pris</span>` : ''}</div></div>
      <div><strong>${kr(x.cost)}</strong> <span class="meta">(${kr(x.perPortion)} per portion)</span></div></div>`;
  }
  html += `<p class="total">Totalt ${kr(total)} av ${kr(budget)}${over ? ' <span class="warn">– över budget, lägg till billigare ingredienser i prislistan eller höj budgeten</span>' : ''}</p>`;
  if (missing > 0) html += `<p class="warn">Hittade inte tillräckligt många recept för alla portioner (${missing} saknas).</p>`;
  html += `<h2>Inköpslista</h2><ul class="list">` + shoppingList(chosen).map(i =>
    `<li>${i.hasAmount ? esc(+i.amount.toFixed(2)) + ' ' + esc(i.unit) + ' ' : ''}${esc(i.name)}</li>`).join('') + `</ul>`;
  return html;
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  const opts = {budget: +v('budget'), total: +v('total'), batch: +v('batch'), maxMin: +v('maxMin'), exclude: v('exclude'), protein: v('protein'), quick: document.getElementById('quick').checked};
  document.getElementById('out').innerHTML = render(plan(opts), opts.budget);
});

Promise.all([
  fetch('data/dataRecipies.json').then(r => r.json()),
  fetch('data/dataPrice.json').then(r => r.json())
]).then(([r, p]) => { recipes = r; prices = p; })
  .catch(() => { document.getElementById('out').innerHTML = '<p class="warn">Kunde inte läsa data/recipes.json eller data/prices.json. Kör sidan via en webbserver, inte genom att dubbelklicka på filen.</p>'; });
</script>
</body>
</html>
